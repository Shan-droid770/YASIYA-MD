<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SAHAN-MD PRO</title>
<style>
  :root {
    --bg1: #0f0c29; --bg2: #302b63; --bg3: #24243e;
    --accent: #00d9ff; --accent2: #7b2ff7; --ok: #00ff88; --warn: #ffcc00; --err: #ff4d6d;
    --card: rgba(255,255,255,0.06); --border: rgba(255,255,255,0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh; color: #fff;
    background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
    background-size: 400% 400%; animation: grad 15s ease infinite;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  @keyframes grad { 0%{background-position:0 50%} 50%{background-position:100% 50%} 100%{background-position:0 50%} }
  .card {
    width: 100%; max-width: 440px; background: var(--card); backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: 22px; padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45); text-align: center;
  }
  .logo {
    font-size: 30px; font-weight: 800; letter-spacing: 1px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .tag { color: #b9b9d6; font-size: 13px; margin-top: 4px; margin-bottom: 22px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
    padding: 7px 16px; border-radius: 999px; margin-bottom: 20px; border: 1px solid var(--border);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .dot.ok { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .dot.err { background: var(--err); box-shadow: 0 0 10px var(--err); }
  .qrbox { background: #fff; border-radius: 16px; padding: 14px; display: inline-block; margin: 6px 0 14px; min-height: 220px; min-width: 220px; display:flex; align-items:center; justify-content:center; }
  .qrbox img { width: 220px; height: 220px; display: block; }
  .hint { color: #cdd0f0; font-size: 13px; line-height: 1.6; margin-top: 8px; }
  .divider { display:flex; align-items:center; gap:10px; color:#8a8ab5; font-size:12px; margin:20px 0; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background:var(--border); }
  input {
    width: 100%; padding: 13px 15px; border-radius: 12px; border: 1px solid var(--border);
    background: rgba(0,0,0,0.25); color: #fff; font-size: 15px; outline: none; margin-bottom: 10px;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; padding: 13px; border-radius: 12px; border: none; cursor: pointer;
    font-size: 15px; font-weight: 700; color: #06121a;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); color:#fff;
    transition: transform .1s ease, opacity .2s;
  }
  button:hover { transform: translateY(-1px); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .code {
    font-size: 30px; font-weight: 800; letter-spacing: 6px; margin: 14px 0;
    color: var(--ok); font-family: 'Courier New', monospace;
  }
  .stats { display:flex; justify-content:space-around; margin-top:22px; padding-top:18px; border-top:1px solid var(--border); }
  .stat b { display:block; font-size:18px; color: var(--accent); }
  .stat span { font-size:11px; color:#a9a9cc; text-transform:uppercase; letter-spacing:.5px; }
  .connected-emoji { font-size: 60px; margin: 10px 0; }
  .err-text { color: var(--err); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🤖 SAHAN-MD PRO</div>
    <div class="tag">Your self-owned WhatsApp bot</div>

    <div class="badge"><span class="dot" id="dot"></span><span id="statusText">Connecting…</span></div>

    <div id="content"><div class="hint">Loading…</div></div>

    <div class="stats">
      <div class="stat"><b id="sCmds">–</b><span>Commands</span></div>
      <div class="stat"><b id="sPrefix">–</b><span>Prefix</span></div>
      <div class="stat"><b id="sMode">–</b><span>Mode</span></div>
    </div>
  </div>

<script>
let paired = false;

async function refresh() {
  try {
    const r = await fetch('/api/status');
    const s = await r.json();
    document.getElementById('sCmds').textContent = s.commands ?? '–';
    document.getElementById('sPrefix').textContent = s.prefix ?? '–';
    document.getElementById('sMode').textContent = s.mode ?? '–';

    const dot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');
    const content = document.getElementById('content');
    dot.className = 'dot';

    if (s.status === 'connected') {
      dot.classList.add('ok');
      statusText.textContent = 'Connected';
      content.innerHTML =
        '<div class="connected-emoji">✅</div>' +
        '<div class="hint"><b>' + (s.me?.name || 'Bot') + '</b> is online!<br>' +
        'Open WhatsApp and send <b>' + s.prefix + 'menu</b> to your bot.</div>';
      return;
    }

    if (s.pairingCode) {
      dot.style.background = 'var(--accent)';
      statusText.textContent = 'Pairing';
      content.innerHTML =
        '<div class="hint">On your phone: WhatsApp → <b>Linked devices</b> → ' +
        '<b>Link a device</b> → <b>Link with phone number</b>, then enter:</div>' +
        '<div class="code">' + s.pairingCode + '</div>';
      return;
    }

    if (s.qr && !paired) {
      statusText.textContent = 'Scan QR';
      content.innerHTML =
        '<div class="qrbox"><img src="' + s.qr + '" alt="QR"></div>' +
        '<div class="hint">Open WhatsApp → <b>Linked devices</b> → <b>Link a device</b> and scan.</div>' +
        renderPairForm();
      return;
    }

    // starting / disconnected without qr yet
    dot.className = 'dot' + (s.status === 'disconnected' ? ' err' : '');
    statusText.textContent = s.status === 'disconnected' ? 'Disconnected' : 'Starting…';
    content.innerHTML =
      '<div class="hint">Preparing login…</div>' +
      (s.lastError ? '<div class="err-text">' + s.lastError + '</div>' : '') +
      renderPairForm();
  } catch (e) {
    document.getElementById('statusText').textContent = 'Server error';
  }
}

function renderPairForm() {
  return (
    '<div class="divider">or link with phone number</div>' +
    '<input id="num" inputmode="numeric" placeholder="Number w/ country code e.g. 9471XXXXXXX">' +
    '<button id="pairBtn" onclick="requestPair()">Get Pairing Code</button>'
  );
}

async function requestPair() {
  const el = document.getElementById('num');
  const btn = document.getElementById('pairBtn');
  const number = (el.value || '').replace(/\D/g, '');
  if (number.length < 8) { alert('Enter a valid number with country code.'); return; }
  btn.disabled = true; btn.textContent = 'Requesting…';
  try {
    const r = await fetch('/api/pair', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ number })
    });
    const j = await r.json();
    if (!j.ok) { alert(j.error || 'Failed'); btn.disabled = false; btn.textContent = 'Get Pairing Code'; return; }
    paired = true;
  } catch { btn.disabled = false; btn.textContent = 'Get Pairing Code'; }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
